name: WakaTime

on:
  schedule: [{ cron: "0 0 * * *" }]
  workflow_dispatch:
  push:
    branches: ["master", "main"]

jobs:
  wakatime:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: lowlighter/metrics@latest
        with:
          filename: wakatime.svg
          token: ${{ secrets.METRICS_TOKEN }}
          output_action: none

          user: suxinghang
          base: ""

          plugin_wakatime: yes
          plugin_wakatime_token: ${{ secrets.WAKATIME_API_KEY }}
          plugin_wakatime_days: 7
          plugin_wakatime_limit: 5
          plugin_wakatime_sections: time, languages
          plugin_wakatime_url: https://wakatime.com
          # Free accounts may not have a custom public username.
          # "current" resolves the account from WAKATIME_API_KEY.
          plugin_wakatime_user: current

      - name: ✨ Style WakaTime labels
        shell: bash
        run: |
          perl -0pi -e 's/WakaTime \(over last week\)/⚡ CODE SIGNAL \/\/ LAST 7 DAYS/g; s/(~[0-9.]+) coding hours recorded/$1 hours logged in the matrix/g; s/(~[0-9.]+) hours of coding per day/$1 hours\/day in the flow/g' wakatime.svg

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wakatime.svg
          if ! git diff --cached --quiet; then
            git commit -m "Update WakaTime activity [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
