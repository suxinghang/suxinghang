name: Update profile dashboard

on:
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  snake:
    name: Generate contribution snake
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-dark
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=8b5cf6&color_dots=#161b22,#312e81,#4c1d95,#7c3aed,#a78bfa
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          build_dir: dist
        env:
          GH_PAT: ${{ secrets.GITHUB_TOKEN }}
          PUBLISH_BRANCH: output

  metrics:
    name: Generate activity skyline
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          filename: github-metrics.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          committer_branch: output
          base: header, activity, community
          template: classic
          config_timezone: Asia/Tokyo
          config_theme: dark
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
